<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!--
    Menu bar icon for Echo (colored, NON-template) — matches the app icon.
    Broken concentric "echo" rings with staggered gaps + center drop,
    water-tone palette (teal -> cyan -> sky), round line caps.
    renders-as-template = false; NSImage.isTemplate = false.
  -->

  <!-- Outer ring (teal) -->
  <path d="M19.29 6.78 A9.3 9.3 0 1 1 10.51 1.71"
        fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Middle ring (cyan) -->
  <path d="M10.65 17.59 A6.6 6.6 0 1 1 16.88 14.0"
        fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Inner ring (sky) -->
  <path d="M8.59 7.8 A4.0 4.0 0 1 1 7.10 11.9"
        fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Center drop -->
  <circle cx="11" cy="11" r="1.9" fill="#bfe9fe"/>
</svg>
